server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: daeho-cms
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/daeho_cms}
    username: ${SPRING_DATASOURCE_USERNAME:daeho}
    password: ${SPRING_DATASOURCE_PASSWORD:daeho}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:true}

cms:
  admin-api-key: ${CMS_ADMIN_API_KEY:}
  admin-password: ${CMS_ADMIN_PASSWORD:}
  notify-to: ${CMS_NOTIFY_TO:}
  smtp-from: ${SMTP_FROM:}
  smtp-secure: ${SMTP_SECURE:false}
  upload-dir: ${CMS_UPLOAD_DIR:./uploads}
  public-upload-base-url: ${CMS_PUBLIC_UPLOAD_BASE_URL:/uploads}
  storage-provider: ${CMS_STORAGE_PROVIDER:local}
  s3-bucket: ${CMS_S3_BUCKET:}
  s3-region: ${CMS_S3_REGION:ap-northeast-2}
  s3-endpoint: ${CMS_S3_ENDPOINT:}
  s3-public-base-url: ${CMS_S3_PUBLIC_BASE_URL:}
  s3-access-key-id: ${CMS_S3_ACCESS_KEY_ID:}
  s3-secret-access-key: ${CMS_S3_SECRET_ACCESS_KEY:}
