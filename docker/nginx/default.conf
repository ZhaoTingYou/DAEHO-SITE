resolver 127.0.0.11 valid=10s ipv6=off;

upstream next_app {
  zone next_app 64k;
  server next:3000 resolve;
}

upstream cms_api {
  zone cms_api 64k;
  server cms-api:8080 resolve;
}

upstream customer_api {
  zone customer_api 64k;
  server customer-api:8081 resolve;
}

limit_req_zone $binary_remote_addr zone=live_chat_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=live_chat_sse:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=live_chat_sse_conn:10m;
limit_req_zone $binary_remote_addr zone=cognito_hook:10m rate=10r/s;

server {
  listen 80;
  server_name _;

  client_max_body_size 64m;

  location /uploads/ {
    proxy_pass http://cms_api/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /api/cms/live-chat {
    proxy_pass http://cms_api/api/cms/live-chat;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/telegram/live-chat/webhook {
    client_max_body_size 256k;
    proxy_pass http://cms_api/api/telegram/live-chat/webhook;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
  }

  location = /api/live-chat/conversations/current/events {
    limit_req zone=live_chat_sse burst=3 nodelay;
    limit_conn live_chat_sse_conn 2;
    proxy_pass http://cms_api/api/live-chat/conversations/current/events;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 75s;
    proxy_set_header Connection "";
    add_header X-Accel-Buffering no;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Daeho-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/live-chat/ {
    limit_req zone=live_chat_api burst=10 nodelay;
    client_max_body_size 16k;
    proxy_pass http://cms_api/api/live-chat/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Daeho-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /internal/cognito/registration-grants/validate {
    limit_except POST { deny all; }
    limit_req zone=cognito_hook burst=10 nodelay;
    proxy_pass http://customer_api/v1/internal/registration-grants/validate;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://next_app;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Daeho-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
