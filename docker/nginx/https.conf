upstream next_app {
  server next:3000;
}

upstream cms_api {
  server cms-api:8080;
}

server {
  listen 80;
  server_name daeho.works;

  return 301 https://daeho.works$request_uri;
}

server {
  listen 80;
  server_name www.daeho.works;

  return 301 https://daeho.works$request_uri;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 64m;

  location /uploads/ {
    proxy_pass http://cms_api/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://next_app;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Daeho-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.daeho.works;

  ssl_certificate /etc/letsencrypt/live/daeho.works/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/daeho.works/privkey.pem;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  return 301 https://daeho.works$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name daeho.works;

  ssl_certificate /etc/letsencrypt/live/daeho.works/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/daeho.works/privkey.pem;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 64m;

  location /uploads/ {
    proxy_pass http://cms_api/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://next_app;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Daeho-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
