services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deaho_cms}
      POSTGRES_USER: ${POSTGRES_USER:-deaho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  cms-api:
    build:
      context: ./backend/cms
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-deaho_cms}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-deaho}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      CMS_ADMIN_API_KEY: ${CMS_BACKEND_API_KEY:-replace-with-a-long-random-key}
      CMS_UPLOAD_DIR: /data/uploads
      CMS_PUBLIC_UPLOAD_BASE_URL: /uploads
      CMS_NOTIFY_TO: ${CMS_NOTIFY_TO:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      - cms_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  next:
    build:
      context: .
      dockerfile: Dockerfile.next
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    restart: unless-stopped
    environment:
      CMS_BACKEND_URL: http://cms-api:8080
      CMS_BACKEND_API_KEY: ${CMS_BACKEND_API_KEY:-replace-with-a-long-random-key}
      CMS_ADMIN_API_KEY: ${CMS_BACKEND_API_KEY:-replace-with-a-long-random-key}
      CMS_ADMIN_PASSWORD: ${CMS_ADMIN_PASSWORD:-replace-with-a-strong-password}
      CMS_ADMIN_SESSION_SECRET: ${CMS_ADMIN_SESSION_SECRET:-replace-with-a-long-random-session-secret}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    depends_on:
      - cms-api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - next
      - cms-api

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deaho_cms}
      POSTGRES_USER: ${POSTGRES_USER:-deaho}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./docker/backup/run-backup.sh:/backup/run-backup.sh:ro
      - cms_uploads:/data/uploads:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "/backup/run-backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  cms_uploads:
  backups:
