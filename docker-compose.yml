services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daeho_cms}
      POSTGRES_USER: ${POSTGRES_USER:-daeho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  cms-api:
    build:
      context: ./backend/cms
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-daeho_cms}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-daeho}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      CMS_ADMIN_API_KEY: ${CMS_BACKEND_API_KEY:-replace-with-a-long-random-key}
      CMS_ADMIN_PASSWORD: ${CMS_ADMIN_PASSWORD:-replace-with-a-strong-password}
      CMS_OWNER_EMAIL: ${CMS_OWNER_EMAIL:-}
      CMS_UPLOAD_DIR: /data/uploads
      CMS_PUBLIC_UPLOAD_BASE_URL: /uploads
      CMS_STORAGE_PROVIDER: ${CMS_STORAGE_PROVIDER:-local}
      CMS_S3_BUCKET: ${CMS_S3_BUCKET:-}
      CMS_S3_REGION: ${CMS_S3_REGION:-ap-northeast-2}
      CMS_S3_ENDPOINT: ${CMS_S3_ENDPOINT:-}
      CMS_S3_PUBLIC_BASE_URL: ${CMS_S3_PUBLIC_BASE_URL:-}
      CMS_S3_ACCESS_KEY_ID: ${CMS_S3_ACCESS_KEY_ID:-}
      CMS_S3_SECRET_ACCESS_KEY: ${CMS_S3_SECRET_ACCESS_KEY:-}
      CMS_NOTIFY_TO: ${CMS_NOTIFY_TO:-}
      CMS_ADMIN_BASE_URL: ${CMS_ADMIN_BASE_URL:-http://localhost/admin}
      CMS_NOTIFICATION_WORKER_ENABLED: ${CMS_NOTIFICATION_WORKER_ENABLED:-true}
      CMS_NOTIFICATION_WORKER_DELAY_MS: ${CMS_NOTIFICATION_WORKER_DELAY_MS:-1000}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_REQUIRED:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SOLAPI_API_BASE_URL: ${SOLAPI_API_BASE_URL:-https://api.solapi.com}
      SOLAPI_API_KEY: ${SOLAPI_API_KEY:-}
      SOLAPI_API_SECRET: ${SOLAPI_API_SECRET:-}
      SOLAPI_PF_ID: ${SOLAPI_PF_ID:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      CMS_TELEGRAM_ENCRYPTION_KEY: ${CMS_TELEGRAM_ENCRYPTION_KEY:-}
      CMS_LIVE_CHAT_SESSION_SECRET: ${CMS_LIVE_CHAT_SESSION_SECRET:-}
      CMS_LIVE_CHAT_ALLOWED_ORIGINS: ${CMS_LIVE_CHAT_ALLOWED_ORIGINS:-https://daeho.works}
      CMS_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://daeho.works}
    volumes:
      - ./public/images:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  next:
    build:
      context: .
      dockerfile: Dockerfile.next
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-G-FXQGWE9XZ0}
        CMS_BUILD_BACKEND_URL: ${CMS_BUILD_BACKEND_URL:-https://daeho.works}
    restart: unless-stopped
    environment:
      CMS_BACKEND_URL: http://cms-api:8080
      CMS_BACKEND_API_KEY: ${CMS_BACKEND_API_KEY:-replace-with-a-long-random-key}
      CMS_ADMIN_API_KEY: ${CMS_BACKEND_API_KEY:-replace-with-a-long-random-key}
      CMS_ADMIN_PASSWORD: ${CMS_ADMIN_PASSWORD:-replace-with-a-strong-password}
      CMS_ADMIN_COOKIE_SECURE: ${CMS_ADMIN_COOKIE_SECURE:-}
      CMS_ADMIN_SESSION_SECRET: ${CMS_ADMIN_SESSION_SECRET:-replace-with-a-long-random-session-secret}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-G-FXQGWE9XZ0}
    volumes:
      - ./public/images:/app/public/images:ro
    depends_on:
      - cms-api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ${NGINX_CONF:-./docker/nginx/default.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${LETSENCRYPT_DIR:-./docker/certs-empty}:/etc/letsencrypt:ro
    depends_on:
      - next
      - cms-api

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daeho_cms}
      POSTGRES_USER: ${POSTGRES_USER:-daeho}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./docker/backup/run-backup.sh:/backup/run-backup.sh:ro
      - ./public/images:/data/uploads:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "/backup/run-backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  backups:
